<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG MODS</title>
    
    <!-- Firebase Realtime Database SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.85)), 
                        url('2f1fe9320e88a23eb6f0a544e4015480.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #ff3333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
            letter-spacing: 1px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .refresh-btn {
            background: #333333;
            color: white;
            border: 1px solid #555555;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-toggle-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }

        /* Admin Bar */
        .admin-bar {
            display: none;
            background: rgba(20, 20, 20, 0.9);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .add-mod-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .visitor-stats {
            font-size: 14px;
            color: #00ffcc;
            font-weight: bold;
        }

        /* Main Container */
        .container {
            padding: 20px 15px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        /* Grid Layout */
        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        /* Square Icon Card */
        .square-card {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .square-card:hover {
            transform: scale(1.03);
            border-color: #ff3333;
        }

        .square-img-container {
            width: 100%;
            padding-top: 100%;
            position: relative;
            overflow: hidden;
        }

        .square-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mod-name {
            padding: 8px 5px;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0, 0, 0, 0.8);
        }

        .action-btns {
            display: none;
            position: absolute;
            top: 5px;
            right: 5px;
            gap: 5px;
            z-index: 5;
        }

        .edit-btn, .delete-btn {
            background: rgba(255, 204, 0, 0.9);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 12px;
            cursor: pointer;
        }

        .delete-btn {
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
        }

        /* Modal Window */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(25, 25, 25, 0.95);
            border: 1px solid #ff3333;
            border-radius: 15px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            color: #aaa;
            cursor: pointer;
        }

        .modal-title {
            color: #ff3333;
            margin-bottom: 10px;
            font-size: 18px;
            text-align: center;
        }

        .modal-details {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 20px;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
        }

        .modal-action-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .dl-mod-btn {
            background: #ff3333;
            color: white;
        }

        .dl-livery-btn {
            background: #0088cc;
            color: white;
        }

        .form-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px 10px;
            background: rgba(0, 0, 0, 0.85);
            border-top: 1px solid rgba(255, 0, 0, 0.3);
            font-size: 13px;
            margin-top: 30px;
        }

        footer p {
            margin-bottom: 5px;
            color: #ddd;
        }

        .insta-links a {
            color: #ff3333;
            text-decoration: none;
            font-weight: bold;
            margin: 0 5px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">BG MODS</div>
        <div class="header-buttons">
            <button class="refresh-btn" onclick="location.reload()">🔄 Refresh</button>
            <button class="admin-toggle-btn" onclick="toggleAdminPanel()">Admin Mode</button>
        </div>
    </header>

    <!-- Admin Panel Control Bar -->
    <div class="admin-bar" id="adminBar">
        <button class="add-mod-btn" onclick="openAddModal()">+ Add New Mod</button>
        <div class="visitor-stats">
            📊 Visitors: <span id="visitorCount">Loading...</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="container">
        <div class="mods-grid" id="modsGrid">
            <p style="text-align:center; grid-column: 1/-1;">Loading Mods...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p><strong>Managed and Designed by BG OFFICIAL</strong></p>
        <div class="insta-links">
            Instagram: 
            <a href="https://instagram.com/mr_bhavith_gowda_445" target="_blank">@mr_bhavith_gowda_445</a> | 
            <a href="https://instagram.com/bg_official_8x" target="_blank">@bg_official_8x</a>
        </div>
    </footer>

    <!-- Mod Click Pop-Up Modal -->
    <div class="modal" id="modModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modModal')">&times;</span>
            <h3 class="modal-title" id="popTitle">Mod Title</h3>
            <div class="modal-details" id="popDetails"></div>
            <a href="#" class="modal-action-btn dl-mod-btn" id="popModLink" onclick="openLink(event, this.href)">📥 DOWNLOAD MOD</a>
            <a href="#" class="modal-action-btn dl-livery-btn" id="popLiveryLink" onclick="openLink(event, this.href)">🎨 DOWNLOAD LIVERY</a>
        </div>
    </div>

    <!-- Admin Add/Edit Modal -->
    <div class="modal" id="adminFormModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminFormModal')">&times;</span>
            <h3 class="modal-title" id="formTitle">Add/Edit Mod</h3>
            <input type="text" id="inputName" class="form-input" placeholder="Mod Name">
            <input type="text" id="inputImage" class="form-input" placeholder="Photo URL / Image File Name">
            <textarea id="inputDetails" class="form-input" placeholder="Mod Details" rows="3"></textarea>
            <input type="text" id="inputModLink" class="form-input" placeholder="Mod Download Link (https://...)">
            <input type="text" id="inputLiveryLink" class="form-input" placeholder="Livery Link (https://...)">
            <button class="modal-action-btn dl-mod-btn" onclick="saveMod()">SAVE MOD REALTIME</button>
        </div>
    </div>

    <script>
        // Firebase Configuration (Direct Realtime Data)
        const firebaseConfig = {
            apiKey: "AIzaSyC7oA0AKtLNY6Jv7akWbpJ",
            authDomain: "bg-mods.firebaseapp.com",
            databaseURL: "https://bg-mods-default-rtdb.firebaseio.com",
            projectId: "bg-mods",
            storageBucket: "bg-mods.firebasestorage.app",
            messagingSenderId: "858746575494",
            appId: "1:858746575494:web:bcad49389278"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const modsRef = database.ref('bg_mods');

        let modsList = {};
        let isAdmin = false;
        let currentEditKey = null;

        // Visitor Counter
        function setupVisitorCounter() {
            const visitorRef = database.ref('visitor_count');
            visitorRef.transaction(current => (current || 0) + 1);
            visitorRef.on('value', snapshot => {
                document.getElementById('visitorCount').innerText = snapshot.val() || 1;
            });
        }

        // Synchronize Mods in Realtime
        modsRef.on('value', (snapshot) => {
            modsList = snapshot.val() || {};
            renderMods();
        });

        // Render Mods to Grid
        function renderMods() {
            const grid = document.getElementById('modsGrid');
            grid.innerHTML = '';

            const keys = Object.keys(modsList);
            if (keys.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No mods added yet!</p>';
                return;
            }

            keys.forEach(key => {
                const mod = modsList[key];
                const card = document.createElement('div');
                card.className = 'square-card';
                
                card.onclick = (e) => {
                    if (!e.target.classList.contains('edit-btn') && !e.target.classList.contains('delete-btn')) {
                        openModDetails(mod);
                    }
                };

                card.innerHTML = `
                    <div class="action-btns" style="display: ${isAdmin ? 'flex' : 'none'};">
                        <button class="edit-btn" onclick="openEditModal('${key}')">✏️</button>
                        <button class="delete-btn" onclick="deleteMod('${key}')">🗑️</button>
                    </div>
                    <div class="square-img-container">
                        <img src="${mod.image || '2f1fe9320e88a23eb6f0a544e4015480.jpg'}" class="square-img" alt="${mod.name}">
                    </div>
                    <div class="mod-name">${mod.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        // Toggle Admin Mode
        function toggleAdminPanel() {
            if (!isAdmin) {
                let pass = prompt("Enter Admin Passcode:");
                if (pass === "BGFF89K") {
                    isAdmin = true;
                    document.getElementById('adminBar').style.display = 'flex';
                    alert("Admin Mode Active!");
                } else {
                    alert("Wrong Password!");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminBar').style.display = 'none';
            }
            renderMods();
        }

        // Open Link Safely
        function openLink(event, url) {
            event.preventDefault();
            if (url && url !== '#' && url !== '') {
                window.open(url, '_system');
            } else {
                alert('No link provided!');
            }
        }

        // Mod Details Pop-up
        function openModDetails(mod) {
            document.getElementById('popTitle').innerText = mod.name;
            document.getElementById('popDetails').innerText = mod.details;
            document.getElementById('popModLink').href = mod.modLink || '#';
            document.getElementById('popLiveryLink').href = mod.liveryLink || '#';
            document.getElementById('modModal').style.display = 'flex';
        }

        // Open Add Modal
        function openAddModal() {
            currentEditKey = null;
            document.getElementById('formTitle').innerText = "Add New Mod";
            document.getElementById('inputName').value = '';
            document.getElementById('inputImage').value = '';
            document.getElementById('inputDetails').value = '';
            document.getElementById('inputModLink').value = '';
            document.getElementById('inputLiveryLink').value = '';
            document.getElementById('adminFormModal').style.display = 'flex';
        }

        // Open Edit Modal
        function openEditModal(key) {
            currentEditKey = key;
            const mod = modsList[key];
            if (mod) {
                document.getElementById('formTitle').innerText = "Edit Mod";
                document.getElementById('inputName').value = mod.name;
                document.getElementById('inputImage').value = mod.image;
                document.getElementById('inputDetails').value = mod.details;
                document.getElementById('inputModLink').value = mod.modLink;
                document.getElementById('inputLiveryLink').value = mod.liveryLink;
                document.getElementById('adminFormModal').style.display = 'flex';
            }
        }

        // Save Mod to Firebase Realtime
        function saveMod() {
            const name = document.getElementById('inputName').value.trim();
            const image = document.getElementById('inputImage').value.trim() || '2f1fe9320e88a23eb6f0a544e4015480.jpg';
            const details = document.getElementById('inputDetails').value.trim();
            let modLink = document.getElementById('inputModLink').value.trim();
            let liveryLink = document.getElementById('inputLiveryLink').value.trim();

            if (!name) {
                alert("Please enter Mod Name!");
                return;
            }

            const modData = {
                name: name,
                image: image,
                details: details,
                modLink: modLink,
                liveryLink: liveryLink,
                timestamp: Date.now()
            };

            if (currentEditKey) {
                modsRef.child(currentEditKey).update(modData, (error) => {
                    if (!error) {
                        alert("Mod Updated Realtime!");
                        closeModal('adminFormModal');
                    } else {
                        alert("Error: " + error.message);
                    }
                });
            } else {
                modsRef.push().set(modData, (error) => {
                    if (!error) {
                        alert("New Mod Saved Realtime!");
                        closeModal('adminFormModal');
                    } else {
                        alert("Error: " + error.message);
                    }
                });
            }
        }

        // Delete Mod Realtime
        function deleteMod(key) {
            if (confirm("Are you sure you want to delete this mod?")) {
                modsRef.child(key).remove();
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Initialize Page
        window.onload = function() {
            setupVisitorCounter();
        };
    </script>
</body>
</html>
